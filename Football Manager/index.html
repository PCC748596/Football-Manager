<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>FootManager Classic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              manager: {
                bg: '#0f172a', 
                panel: '#1e293b', 
                accent: '#3b82f6', 
                success: '#10b981', 
                danger: '#ef4444', 
                text: '#f1f5f9', 
                muted: '#94a3b8', 
              }
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.3); 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3b82f6; 
      }
      
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: background-color 0.3s ease;
      }

      /* Transição suave entre temas */
      html.dark body {
        background-color: #020617;
      }
      html:not(.dark) body {
        background-color: #f1f5f9;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /*
       * Container principal: ocupa a tela inteira.
       * Antes era travado em 16:9 (height: 56.25vw / max-width: 177.78vh), o que
       * deixava barras vazias em qualquer monitor de outra proporção — 16:10,
       * ultrawide, notebook 3:2. Nada depende mais dessa proporção: o motor 3D
       * mede o próprio contêiner (clientWidth) e o campo tático tem aspect-ratio
       * próprio.
       */
      .game-container {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        box-shadow: 0 0 50px rgba(0,0,0,0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: background-color 0.3s ease;
      }
      
      .dark .game-container {
        background-color: #0f172a;
        box-shadow: 0 0 100px rgba(0,0,0,0.8), 0 0 20px rgba(59,130,246,0.1);
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 2s linear infinite;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.6s ease-out forwards;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
