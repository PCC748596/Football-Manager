<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparar modelos — Soccer Simulator</title>
<!--
COMPARAR MODELOS EM T-POSE: o corpo dos jogadores como esta e a versao leve (sem esferas nas juntas, membros a entrar uns nos outros, torax com menos subdivisoes), lado a lado, com a contagem de triangulos de cada uma.
Vem do mesmo `construirCorpo` (js/pose.js) com o parametro `leve` (0 = actual, 1 = leve). Arrastar roda a camara; roda do rato aproxima.
-->
<style>
html, body { margin:0; height:100%; background:#0f1420; color:#e6ebf5; font:14px system-ui,Segoe UI,Arial,sans-serif; overflow:hidden; }
#c { position:absolute; inset:0; width:100%; height:100%; display:block; }
#info { position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:space-around; pointer-events:none; text-align:center; }
#info div { background:rgba(15,20,32,.8); border:1px solid #27304a; border-radius:8px; padding:8px 14px; min-width:190px; }
#info b { display:block; font-size:15px; } #info span { color:#8a96b3; }
#topo { position:absolute; top:8px; left:12px; color:#8a96b3; }
label { margin-right:14px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topo">Arrasta para rodar · roda do rato para aproximar &nbsp;
    <label><input type="checkbox" id="fio"> ver malha (wireframe)</label></div>
<div id="info"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config/physics.js"></script>
<script src="js/config/animations.js"></script>
<script src="js/config/gait.js"></script>
<script src="js/config/gait_clips.js"></script>
<script src="js/config/gk_clips_pes.js"></script>
<script src="js/config/tactics.js"></script>
<script src="js/config/passing.js"></script>
<script src="js/config/shooting.js"></script>
<script src="js/config/defense.js"></script>
<script src="js/config/goalkeeper.js"></script>
<script src="js/config/player_behavior.js"></script>
<script src="js/utils.js"></script>
<script src="js/pose.js"></script>
<script>
(function () {
    const cv = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0f1420);
    scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2f38, 0.9));
    const sol = new THREE.DirectionalLight(0xffffff, 0.8); sol.position.set(3, 6, 4); scene.add(sol);
    const chao = new THREE.Mesh(new THREE.CircleGeometry(5, 48), new THREE.MeshStandardMaterial({ color: 0x1e2a20, roughness: 1 }));
    chao.rotation.x = -Math.PI / 2; scene.add(chao);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);

    const NOMES = ['SEM ESFERAS nas juntas (usado no jogo)', 'METADE (sem travas, torax simples)', 'MINIMO (424 ou menos)'];
    const corpos = [], info = document.getElementById('info');
    [1, 4, 5].forEach((leve, i) => {
        const f = construirCorpo('#c0392b', '#ffffff', undefined, undefined, leve);
        // T-pose: bracos na horizontal, pernas e cotovelos esticados.
        f.rig.lArm.rotation.set(0, 0, Math.PI / 2); f.rig.rArm.rotation.set(0, 0, -Math.PI / 2);
        f.rig.lElbow.rotation.x = 0; f.rig.rElbow.rotation.x = 0;
        f.rig.lLeg.rotation.set(0, 0, 0); f.rig.rLeg.rotation.set(0, 0, 0); f.rig.lKnee.rotation.x = 0; f.rig.rKnee.rotation.x = 0;
        f.corpo.position.set((i - 1) * 2.6, 0, 0);
        scene.add(f.corpo);
        let tri = 0, malhas = 0;
        f.corpo.traverse(o => { if (o.isMesh) { malhas++; tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
        corpos.push(f.corpo);
        const d = document.createElement('div');
        d.innerHTML = '<b>' + NOMES[i] + '</b>' + Math.round(tri).toLocaleString('pt-PT') + ' triangulos<br><span>' + malhas + ' malhas · ' + Math.round(tri / 888 * 100) + '% do usado no jogo</span>';
        info.appendChild(d);
    });

    document.getElementById('fio').addEventListener('change', (e) => {
        corpos.forEach(c => c.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.wireframe = e.target.checked; }); }));
    });

    let a = 0.35, el = 0.18, r = 8.2;
    const alvo = new THREE.Vector3(0, 0.95, 0);
    const colocar = () => { el = Math.max(-0.2, Math.min(1.3, el)); r = Math.max(2, Math.min(20, r)); camera.position.set(alvo.x + r * Math.sin(a) * Math.cos(el), alvo.y + r * Math.sin(el), alvo.z + r * Math.cos(a) * Math.cos(el)); camera.lookAt(alvo); };
    let arr = null;
    cv.addEventListener('pointerdown', e => { arr = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointerup', () => { arr = null; });
    cv.addEventListener('pointermove', e => { if (!arr) return; a -= (e.clientX - arr.x) * 0.006; el += (e.clientY - arr.y) * 0.006; arr = { x: e.clientX, y: e.clientY }; colocar(); });
    cv.addEventListener('wheel', e => { r *= e.deltaY > 0 ? 1.1 : 0.9; colocar(); e.preventDefault(); }, { passive: false });
    const ajustar = () => { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); };
    window.addEventListener('resize', ajustar); ajustar(); colocar();
    (function laco() { renderer.render(scene, camera); requestAnimationFrame(laco); })();
})();
</script>
</body>
</html>
