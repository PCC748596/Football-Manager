<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Cabeca do jogador</title>
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<script src="js/vendor/three.r128.min.js"></script>
<script src="js/config/physics.js"></script>
<script src="js/config/animations.js"></script>
<script src="js/config/gait.js"></script>
<script src="js/config/gait_clips.js"></script>
<script src="js/config/gk_clips_pes.js"></script>
<script src="js/config/tactics.js"></script>
<script src="js/config/passing.js"></script>
<script src="js/config/shooting.js"></script>
<script src="js/config/defense.js"></script>
<script src="js/config/goalkeeper.js"></script>
<script src="js/config/player_behavior.js"></script>
<script src="data/faces.js"></script>
<script src="js/utils.js"></script>
<script src="js/pose.js"></script>
<script>
/*
A CABECA DO JOGADOR EM 3D, COMO IMAGEM — o corpo REAL do jogo (`construirCorpo`, js/pose.js) com a cabeca e os ombros virados uns graus (a "foto de tres quartos" do overview), desenhado uma vez por jogador
e devolvido como PNG (data URL). Assim o penteado, a barba e os oculos sao exatamente os do 3D. O manager (components/PlayerFace3D.tsx) pede por postMessage e guarda o resultado:
  { tipo: 'cabeca', req, id, camisa, graus, uniforme }   ->   { tipo: 'cabecaPronta', req, url }
*/
const TAM = 256;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(TAM, TAM);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(18, 1, 0.1, 50);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a2030, 0.75));
const sol = new THREE.DirectionalLight(0xfff0d8, 0.8); sol.position.set(-1.5, 3, 5); scene.add(sol);
const recorte = new THREE.DirectionalLight(0x6f8cff, 0.3); recorte.position.set(3, 2, -4); scene.add(recorte);
const ALTURA = 1.8;
let atual = null;

function desenhar(id, camisa, graus, uniforme, alto, estilo) {
    if (atual) { scene.remove(atual); atual = null; }
    let ap = aparenciaDoJogador(id);
    if (ap && !ap.estilo && typeof estiloDeCabeloDe === 'function') ap = Object.assign({}, ap, { estilo: estiloDeCabeloDe(id, ap.tipo) });
    if (ap && !ap.barba && typeof estiloDeBarbaDe === 'function') ap = Object.assign({}, ap, { barba: estiloDeBarbaDe(id, ap.tipo) });
    const calcao = (uniforme && uniforme.calcao && uniforme.calcao.cores && uniforme.calcao.cores[0]) || '#ffffff';
    if (estilo) ap = Object.assign({}, ap, { estilo });   // so para testes: forca o penteado
    const feito = construirCorpo(camisa, calcao, ap, uniforme || null, 0);
    const corpo = feito.corpo, rig = feito.rig;
    const base = corpo.scale.x;
    const h0 = new THREE.Box3().setFromObject(corpo);
    const f = ALTURA / (h0.max.y - h0.min.y);
    corpo.scale.set(base * f, base * f, base * f);
    if (rig.lArm && rig.rArm) { rig.lArm.rotation.z = 0.12; rig.rArm.rotation.z = -0.12; }
    const g = new THREE.Group(); g.add(corpo);
    const b = new THREE.Box3().setFromObject(g);
    corpo.position.y -= b.min.y;
    g.rotation.y = THREE.MathUtils.degToRad(graus);   // positivo: o rosto olha para a DIREITA da imagem
    scene.add(g); atual = g;
    // Enquadra a cabeca e os ombros: o topo da cabeca fica perto do topo da imagem.
    const cabeca = rig.head || (rig.neck && rig.neck.children.find(o => o.isMesh));
    g.updateMatrixWorld(true);
    const alvo = new THREE.Vector3();
    if (cabeca) cabeca.getWorldPosition(alvo); else alvo.set(0, 1.62, 0);
    const meiaTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = (alto || 0.62) / (2 * meiaTan);   // ~0.62 m de altura visivel: cabeca e ombros
    const yc = alvo.y - 0.07 - (alto ? (alto - 0.62) * 0.4 : 0);
    camera.position.set(0, yc, dist);
    camera.lookAt(0, yc, 0);
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
}


/*
O CORPO INTEIRO, DE COSTAS (pedido: os quatro uniformes do overview do clube, com um jogador generico): o mesmo `construirCorpo`, com as costas pintadas como o `updateShirt` do jogo (o padrao da camisa
e o numero, na cor e contorno do uniforme), virado `graus` (180 = de costas; ~155 = meio de costas, para ver tambem um lado). Devolve um PNG mais alto que largo.
  { tipo: 'corpo', req, camisa, uniforme, numero, graus }
*/
function desenharCorpo(camisa, uniforme, numero, graus) {
    if (atual) { scene.remove(atual); atual = null; }
    const ap = { tipo: 'castanhoClaro', cabelo: 0x5a4028, pele: 0xe0b890, chuteira: 'preta', corChuteira: 0x1c1c1c, estilo: 'curto', barba: 'nenhuma' };
    const calcao = (uniforme && uniforme.calcao && uniforme.calcao.cores && uniforme.calcao.cores[0]) || '#ffffff';
    const feito = construirCorpo(camisa, calcao, ap, uniforme || null, 0);
    const corpo = feito.corpo, rig = feito.rig, backMat = feito.backMat;
    // As costas: o padrao da camisa por baixo e o numero por cima (como Player.updateShirt).
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
    const cx = cv.getContext('2d');
    const peca = uniforme ? uniforme.camisa : null;
    const k = peca && peca.padrao === 'kit' ? peca.kit : null;
    const faixaUnica = !!(k && k.diagonal && k.c2 && !k.multipleDiagonals && !k.dualDiagonal);
    if (peca && !faixaUnica && typeof pintarPadraoDeEquipamento === 'function') pintarPadraoDeEquipamento(cx, 512, 512, peca, camisa);
    else { cx.fillStyle = faixaUnica ? k.c1 : camisa; cx.fillRect(0, 0, 512, 512); }
    const TIPO = (typeof CamisolaTipografia !== 'undefined') ? CamisolaTipografia : { fonteNumero: '"Segoe UI", Arial, sans-serif', pesoNumero: 'bold' };
    cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.lineJoin = 'round';
    cx.font = (TIPO.pesoNumero ? TIPO.pesoNumero + ' ' : '') + '260px ' + TIPO.fonteNumero;
    cx.lineWidth = 16; cx.strokeStyle = (uniforme && uniforme.contorno) || 'rgba(0,0,0,0.75)';
    cx.strokeText(String(numero), 256, 300);
    cx.fillStyle = (uniforme && uniforme.numero) || '#ffffff';
    cx.fillText(String(numero), 256, 300);
    // O numero na frente do calcao (como Player.pintarNumeroNoShort): o fundo do calcao repintado e o numero por cima, na perna esquerda do jogador.
    const F = feito.shortFrente;
    if (F && F.cvs) {
        const SN = (typeof ShortNumero !== 'undefined') ? ShortNumero : { x: 0.30, y: 0.40, tamanho: 96, contorno: 6 };
        const c2 = F.cvs.getContext('2d');
        if (F.peca && typeof pintarPadraoDeEquipamento === 'function') pintarPadraoDeEquipamento(c2, 256, 256, F.peca, F.cor);
        else { c2.fillStyle = (typeof F.cor === 'number') ? '#' + F.cor.toString(16).padStart(6, '0') : F.cor; c2.fillRect(0, 0, 256, 256); }
        const bc = new THREE.Color(F.cor);
        const claro = (0.2126 * bc.r + 0.7152 * bc.g + 0.0722 * bc.b) > 0.5;
        const U = uniforme || {};
        c2.save();
        c2.scale(1.10 / 0.68, 1);
        c2.font = 'bold ' + SN.tamanho + 'px sans-serif';
        c2.textAlign = 'center'; c2.textBaseline = 'middle'; c2.lineJoin = 'round';
        c2.lineWidth = SN.contorno;
        c2.strokeStyle = U.contornoCalcao || U.contorno || (claro ? 'rgba(255,255,255,0.8)' : 'rgba(0,0,0,0.8)');
        c2.fillStyle = U.numeroCalcao || U.numero || (claro ? '#000000' : '#ffffff');
        const px = SN.x * 256 / (1.10 / 0.68), py = SN.y * 256;
        c2.strokeText(String(numero), px, py); c2.fillText(String(numero), px, py);
        c2.restore();
        if (F.mat && F.mat.map) F.mat.map.needsUpdate = true;
    }
    if (backMat) { backMat.map = new THREE.CanvasTexture(cv); backMat.color.set(0xffffff); backMat.needsUpdate = true; }
    const base = corpo.scale.x;
    const h0 = new THREE.Box3().setFromObject(corpo);
    const f = ALTURA / (h0.max.y - h0.min.y);
    corpo.scale.set(base * f, base * f, base * f);
    if (rig.lArm && rig.rArm) { rig.lArm.rotation.z = 0.12; rig.rArm.rotation.z = -0.12; }
    const g = new THREE.Group(); g.add(corpo);
    const b = new THREE.Box3().setFromObject(g);
    corpo.position.y -= b.min.y;
    g.rotation.y = THREE.MathUtils.degToRad(graus);
    scene.add(g); atual = g;
    // So da barra do calcao para cima (pedido): o enquadramento vai de y ~0.58 m (a barra do calcao) ate acima da cabeca.
    const LARGO = 220, ALTO = 250;
    renderer.setSize(LARGO, ALTO); camera.aspect = LARGO / ALTO; camera.updateProjectionMatrix();
    const meiaTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const dist = Math.max(1.3 / (2 * meiaTan), 1.15 / (2 * meiaTan * camera.aspect));
    camera.position.set(0, 1.22, dist);
    camera.lookAt(0, 1.22, 0);
    renderer.render(scene, camera);
    const url = renderer.domElement.toDataURL('image/png');
    renderer.setSize(TAM, TAM); camera.aspect = 1; camera.updateProjectionMatrix();   // volta ao quadrado das cabecas
    return url;
}

window.addEventListener('message', e => {
    const m = e.data || {};
    if (m.tipo === 'corpo') {
        let u = '';
        try { u = desenharCorpo(m.camisa || '#475569', m.uniforme || null, m.numero == null ? 9 : m.numero, typeof m.graus === 'number' ? m.graus : 155); } catch (err) { console.warn('[corpo]', err); }
        parent.postMessage({ tipo: 'cabecaPronta', req: m.req, url: u }, '*');
        return;
    }
    if (m.tipo !== 'cabeca') return;
    const id = Number(String(m.id).replace(/^p-/, '')) >>> 0;
    let url = '';
    try { url = desenhar(id, m.camisa || '#475569', typeof m.graus === 'number' ? m.graus : 20, m.uniforme || null, m.alto, m.estilo); } catch (err) { console.warn('[cabeca]', err); }
    parent.postMessage({ tipo: 'cabecaPronta', req: m.req, url }, '*');
});
parent.postMessage({ tipo: 'cabecaPronto' }, '*');
</script>
</body>
</html>
